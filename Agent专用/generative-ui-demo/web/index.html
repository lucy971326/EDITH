<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniMax Generative UI</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <section class="control-panel">
      <p class="eyebrow">MINIMAX · STRUCTURED OUTPUT</p>
      <h1>用一句话生成界面</h1>
      <p class="hint">后端只返回受控 JSON，前端根据组件白名单构建页面。</p>
      <form id="generator-form">
        <textarea id="prompt" rows="4">做一个黑色科技感的 AI 产品仪表盘，展示今日请求数、成功率和一个升级按钮</textarea>
        <button id="submit" type="submit">生成 UI</button>
      </form>
      <details>
        <summary>查看模型返回的 JSON</summary>
        <pre id="json-output">尚未生成</pre>
      </details>
    </section>

    <section class="preview-panel">
      <div class="browser-bar">
        <span></span><span></span><span></span>
        <p>agent-ui.local</p>
      </div>
      <div id="preview" class="preview empty">
        <p>生成后的界面将出现在这里</p>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>

components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    FrontendEvent:
      additionalProperties: false
      properties:
        arguments:
          type: string
        id:
          type: string
        message:
          type: string
        name:
          type: string
        request_id:
          type: string
        result: {}
        text:
          type: string
        thinking:
          type: string
        type:
          type: string
        usage:
          $ref: "#/components/schemas/Usage"
      required:
        - type
        - request_id
      type: object
    Usage:
      additionalProperties: false
      properties:
        completion_tokens:
          format: int64
          type: integer
        prompt_tokens:
          format: int64
          type: integer
        total_tokens:
          format: int64
          type: integer
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
      type: object
info:
  title: Agent API
  version: 1.0.0
openapi: 3.1.0
paths:
  /stream:
    post:
      operationId: stream-chat
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                items:
                  oneOf:
                    - properties:
                        data:
                          $ref: "#/components/schemas/FrontendEvent"
                        event:
                          const: done
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event done
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/FrontendEvent"
                        event:
                          const: error
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event error
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/FrontendEvent"
                        event:
                          const: text
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event text
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/FrontendEvent"
                        event:
                          const: tool_call
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event tool_call
                      type: object
                    - properties:
                        data:
                          $ref: "#/components/schemas/FrontendEvent"
                        event:
                          const: tool_result
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event tool_result
                      type: object
                title: Server Sent Events
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 聊天流

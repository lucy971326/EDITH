<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDITH · Sandbox 文件</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f6f7f9;
      --panel: #ffffff;
      --line: #e5e7eb;
      --text: #20242b;
      --muted: #737985;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --code: #111827;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 960px; margin: 0; background: var(--page); color: var(--text);
      font: 14px/1.5 Inter, "Microsoft YaHei", system-ui, sans-serif;
    }
    .app { height: 100vh; display: grid; grid-template-columns: 240px 1fr; }
    .sidebar { padding: 24px 16px; border-right: 1px solid var(--line); background: #fff; }
    .brand { font-size: 20px; font-weight: 750; letter-spacing: -.03em; margin: 0 10px 32px; }
    .nav-item { display: block; padding: 11px 12px; border-radius: 9px; color: #4b5563; margin-bottom: 6px; }
    .nav-item.active { background: #f1f3f5; color: #111827; font-weight: 650; }
    main { min-width: 0; display: flex; flex-direction: column; }
    .header { height: 78px; padding: 18px 30px; border-bottom: 1px solid var(--line); background: #fff; }
    h1 { font-size: 20px; line-height: 1.2; margin: 0 0 4px; letter-spacing: -.025em; }
    .subtitle { color: var(--muted); }
    .workspace { min-height: 0; flex: 1; padding: 24px 30px 30px; }
    .file-view {
      height: 100%; min-height: 570px; display: grid; grid-template-columns: 310px 1fr;
      overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
      box-shadow: 0 5px 18px rgba(17,24,39,.04);
    }
    .tree-pane { min-width: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
    .pane-title { padding: 19px 20px 13px; font-weight: 700; font-size: 15px; }
    .search { margin: 0 14px 12px; padding: 9px 11px; width: calc(100% - 28px); border: 1px solid var(--line); border-radius: 8px; outline: none; font: inherit; }
    .tree { overflow: auto; padding: 0 8px 16px; }
    .node { display: flex; align-items: center; gap: 7px; min-height: 31px; padding: 4px 8px; border-radius: 7px; cursor: pointer; user-select: none; }
    .node:hover { background: #f6f7f9; }
    .node.selected { background: var(--blue-soft); color: #174ea6; font-weight: 650; }
    .caret { width: 12px; color: #9ca3af; font-size: 11px; text-align: center; }
    .icon { width: 18px; height: 18px; display: inline-grid; place-items: center; color: #7b8494; }
    .icon svg { width: 17px; height: 17px; stroke-width: 1.8; }
    .folder > .icon { color: #d69e2e; }
    .file[data-name$=".py"] > .icon { color: #3776ab; }
    .file[data-name$=".md"] > .icon { color: #4f74c9; }
    .file[data-name$=".json"] > .icon { color: #a16207; }
    .file[data-name$=".csv"] > .icon { color: #0f9d76; }
    .children { margin-left: 15px; border-left: 1px solid #edf0f2; padding-left: 5px; }
    .collapsed { display: none; }
    .preview { min-width: 0; display: flex; flex-direction: column; }
    .tabs { height: 48px; display: flex; border-bottom: 1px solid var(--line); align-items: end; padding-left: 16px; }
    .tab { display: flex; gap: 9px; align-items: center; height: 48px; padding: 0 16px; border-right: 1px solid var(--line); border-bottom: 2px solid var(--blue); font-weight: 650; }
    .crumb { padding: 13px 22px; color: var(--muted); border-bottom: 1px solid var(--line); font-size: 13px; }
    .crumb strong { color: #4b5563; }
    .empty { display: grid; place-items: center; flex: 1; color: var(--muted); }
    .content { margin: 0; padding: 18px 0; overflow: auto; flex: 1; background: #fcfcfd; color: var(--code); font: 13px/1.7 "Cascadia Code", Consolas, monospace; }
    .line { display: block; padding: 0 24px 0 68px; position: relative; white-space: pre; }
    .line::before { content: attr(data-line); color: #a5acb8; position: absolute; left: 0; width: 48px; padding-right: 14px; text-align: right; border-right: 1px solid #edf0f2; }
    .comment { color: #8492a6; font-style: italic; }
    .keyword { color: #a855f7; }
    .string { color: #16a34a; }
    .footer-note { padding: 11px 20px; color: var(--muted); border-top: 1px solid var(--line); font-size: 12px; }
    @media (max-width: 1050px) { .app { grid-template-columns: 190px 1fr; } .workspace { padding: 18px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">EDITH</div>
      <div class="nav-item">＋ 新对话</div>
      <div class="nav-item">定时任务</div>
      <div class="nav-item">扩展</div>
      <div class="nav-item active">Sandbox 文件</div>
    </aside>
    <main>
      <header class="header">
        <h1>当前会话的 Sandbox</h1>
        <div class="subtitle">只读查看 Agent 在本会话工作区生成的文件。</div>
      </header>
      <section class="workspace">
        <div class="file-view">
          <aside class="tree-pane">
            <div class="pane-title">文件</div>
            <input class="search" id="search" placeholder="筛选文件…" />
            <div class="tree" id="tree">
              <div class="node folder" data-target="uploads"><span class="caret">⌄</span><span class="icon" data-icon="folder"></span><span>uploads</span></div>
              <div class="children" id="uploads">
                <div class="node file" data-name="meeting-notes.md"><span class="caret"></span><span class="icon" data-icon="file-text"></span><span>meeting-notes.md</span></div>
              </div>
              <div class="node folder" data-target="work"><span class="caret">⌄</span><span class="icon" data-icon="folder"></span><span>work</span></div>
              <div class="children" id="work">
                <div class="node file selected" data-name="report.md"><span class="caret"></span><span class="icon" data-icon="file-text"></span><span>report.md</span></div>
                <div class="node file" data-name="analysis.py"><span class="caret"></span><span class="icon" data-icon="file-code"></span><span>analysis.py</span></div>
                <div class="node file" data-name="chart.csv"><span class="caret"></span><span class="icon" data-icon="table"></span><span>chart.csv</span></div>
              </div>
              <div class="node folder" data-target="artifacts"><span class="caret">⌄</span><span class="icon" data-icon="folder"></span><span>artifacts</span></div>
              <div class="children" id="artifacts">
                <div class="node file" data-name="summary.json"><span class="caret"></span><span class="icon" data-icon="braces"></span><span>summary.json</span></div>
              </div>
              <div class="node folder" data-target="skills"><span class="caret">›</span><span class="icon" data-icon="folder"></span><span>skills</span></div>
              <div class="children collapsed" id="skills">
                <div class="node folder" data-target="skills-custom"><span class="caret">›</span><span class="icon" data-icon="folder"></span><span>custom</span></div>
                <div class="children collapsed" id="skills-custom"></div>
              </div>
            </div>
          </aside>
          <section class="preview">
            <div class="tabs"><div class="tab"><span class="icon" data-icon="file-text"></span><span id="tab-name">report.md</span></div></div>
            <div class="crumb">Sandbox <span>›</span> work <span>›</span> <strong id="crumb-name">report.md</strong></div>
            <pre class="content" id="content"></pre>
            <div class="footer-note">演示版：仅展示布局与交互；真实版本将从当前会话的 Sandbox 读取目录和文件内容。</div>
          </section>
        </div>
      </section>
    </main>
  </div>
  <script>
    const icons = {
      folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg>',
      'file-text': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h8M8 17h8"/></svg>',
      'file-code': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5z"/><polyline points="14 2 14 8 20 8"/><path d="m10 13-2 2 2 2m4 0 2-2-2-2"/></svg>',
      table: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M9 21V9"/></svg>',
      braces: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1m8-18h1a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a2 2 0 0 1-2 2h-1"/></svg>'
    };
    document.querySelectorAll('[data-icon]').forEach(element => { element.innerHTML = icons[element.dataset.icon] || ''; });
    const files = {
      "report.md": [
        '<span class="comment"># 数据分析报告</span>', '',
        '## 结论', '',
        '本次分析完成，结果已生成到 <span class="string">artifacts/</span> 目录。', '',
        '## 下一步', '',
        '- 检查图表数据', '- 根据反馈更新报告'
      ],
      "analysis.py": [
        '<span class="comment"># 当前会话的分析脚本</span>', '',
        '<span class="keyword">import</span> csv', '',
        '<span class="keyword">def</span> <span class="string">load_rows</span>(path):', '    <span class="keyword">with</span> open(path, encoding=<span class="string">"utf-8"</span>) <span class="keyword">as</span> file:', '        <span class="keyword">return</span> list(csv.DictReader(file))'
      ],
      "chart.csv": ['month,value', '2026-05,42', '2026-06,56', '2026-07,68'],
      "summary.json": ['{', '  <span class="string">"status"</span>: <span class="string">"completed"</span>,', '  <span class="string">"files"</span>: 3', '}'],
      "meeting-notes.md": ['<span class="comment"># 会议记录</span>', '', '- 确认本周交付范围', '- 下次同步：周五']
    };
    const content = document.querySelector('#content');
    const show = (name) => {
      const lines = files[name] || ['此文件暂无可预览的文本内容。'];
      content.innerHTML = lines.map((line, index) => `<span class="line" data-line="${index + 1}">${line || ' '}</span>`).join('');
      document.querySelector('#tab-name').textContent = name;
      document.querySelector('#crumb-name').textContent = name;
      document.querySelectorAll('.node.file').forEach(node => node.classList.toggle('selected', node.dataset.name === name));
    };
    document.querySelectorAll('.node.folder').forEach(node => node.addEventListener('click', () => {
      const child = document.getElementById(node.dataset.target);
      if (!child) return;
      child.classList.toggle('collapsed');
      node.querySelector('.caret').textContent = child.classList.contains('collapsed') ? '›' : '⌄';
    }));
    document.querySelectorAll('.node.file').forEach(node => node.addEventListener('click', () => show(node.dataset.name)));
    document.querySelector('#search').addEventListener('input', event => {
      const query = event.target.value.trim().toLowerCase();
      document.querySelectorAll('.node.file').forEach(node => { node.style.display = node.dataset.name.includes(query) ? '' : 'none'; });
    });
    show('report.md');
  </script>
</body>
</html>
